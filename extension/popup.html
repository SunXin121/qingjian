<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青简网页剪藏</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="mark">简</span><div><h1>剪藏到青简</h1><p>把值得留住的网页，放进知识库。</p></div></header>
  <form id="clip-form">
    <label for="server">青简站点地址</label>
    <input id="server" type="url" placeholder="https://note.example.com" required autocomplete="url">
    <label for="mode">剪藏方式</label>
    <select id="mode"><option value="article">正文 · 自动去除导航与广告</option><option value="selection">选中内容 · 保留选区内的格式</option><option value="page">整页 · 当前已加载的页面内容</option><option value="link">仅链接 · 保存标题与网址</option></select>
    <p class="hint">将在青简中预览并选择保存目录。图片保留原站链接。</p>
    <p id="status" role="status" aria-live="polite"></p>
    <button type="submit" id="submit">提取并打开青简</button>
  </form>
  <footer><button id="retry" class="text" hidden>重新打开上次草稿</button><button id="clear" class="text" hidden>清除草稿副本</button></footer>
  <script src="popup.js"></script>
</body>
</html>
