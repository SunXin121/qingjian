services:
  qingjian:
    # 由 GitHub Actions 自动构建的镜像；想在本机构建可改用 `docker compose up -d --build`
    image: ${QINGJIAN_IMAGE:-ghcr.io/sunxin121/qingjian:latest}
    build: .
    container_name: qingjian
    restart: unless-stopped
    environment:
      QINGJIAN_ADMIN_PASSWORD: ${QINGJIAN_ADMIN_PASSWORD:?请在 .env 中设置 QINGJIAN_ADMIN_PASSWORD}
      QINGJIAN_MAX_UPLOAD_MB: ${QINGJIAN_MAX_UPLOAD_MB:-100}
      # 放在 Nginx / Caddy 等反向代理后面时设为 1；直接对外暴露时保持为空
      QINGJIAN_TRUST_PROXY: ${QINGJIAN_TRUST_PROXY:-}
      QINGJIAN_TRASH_DAYS: ${QINGJIAN_TRASH_DAYS:-30}
      QINGJIAN_DRAWIO_URL: ${QINGJIAN_DRAWIO_URL:-}
      QINGJIAN_DRAWIO_DIR: ${QINGJIAN_DRAWIO_DIR:-}
      QINGJIAN_PLANTUML_URL: ${QINGJIAN_PLANTUML_URL:-}
      QINGJIAN_BACKUP_INTERVAL_HOURS: ${QINGJIAN_BACKUP_INTERVAL_HOURS:-24}
      QINGJIAN_BACKUP_KEEP: ${QINGJIAN_BACKUP_KEEP:-7}
      QINGJIAN_BACKUP_DIR: ${QINGJIAN_BACKUP_DIR:-}
      QINGJIAN_BACKUP_WEBDAV_URL: ${QINGJIAN_BACKUP_WEBDAV_URL:-}
      QINGJIAN_BACKUP_WEBDAV_USER: ${QINGJIAN_BACKUP_WEBDAV_USER:-}
      QINGJIAN_BACKUP_WEBDAV_PASSWORD: ${QINGJIAN_BACKUP_WEBDAV_PASSWORD:-}
      QINGJIAN_BACKUP_S3_ENDPOINT: ${QINGJIAN_BACKUP_S3_ENDPOINT:-}
      QINGJIAN_BACKUP_S3_REGION: ${QINGJIAN_BACKUP_S3_REGION:-}
      QINGJIAN_BACKUP_S3_BUCKET: ${QINGJIAN_BACKUP_S3_BUCKET:-}
      QINGJIAN_BACKUP_S3_PREFIX: ${QINGJIAN_BACKUP_S3_PREFIX:-}
      QINGJIAN_BACKUP_S3_ACCESS_KEY: ${QINGJIAN_BACKUP_S3_ACCESS_KEY:-}
      QINGJIAN_BACKUP_S3_SECRET_KEY: ${QINGJIAN_BACKUP_S3_SECRET_KEY:-}
    ports:
      - "${QINGJIAN_BIND:-127.0.0.1}:${QINGJIAN_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      # 本地备份目录（配合 QINGJIAN_BACKUP_DIR=/backup）
      # - ./backup:/backup
      # 离线 draw.io（配合 QINGJIAN_DRAWIO_DIR=/drawio）
      # - ./drawio:/drawio:ro

  # PlantUML 渲染服务（可选）：取消注释，并在 .env 中设置 QINGJIAN_PLANTUML_URL=http://plantuml:8080
  # plantuml:
  #   image: plantuml/plantuml-server:jetty
  #   container_name: qingjian-plantuml
  #   restart: unless-stopped
